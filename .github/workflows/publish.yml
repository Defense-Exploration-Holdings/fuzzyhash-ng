name: Publish to npm
# Publishes packages/fuzzyhash-ng to npm when a v* tag is pushed. CI runs on CircleCI;
# this workflow exists only because npm trusted publishing (OIDC) needs it.
#
# Three jobs, so that nothing that installs or runs third-party code can publish:
#
#   build    Checks the tag, builds, runs the tests, packs the tarball and uploads it
#            with its SHA-256. Read-only token, no environment, no OIDC token.
#   publish  Downloads that tarball, verifies the SHA-256 and runs `npm publish`.
#            The only job that holds the OIDC token. It does not check out the
#            repository, install dependencies or run build or test code.
#   release  Creates the GitHub Release for the tag with the CHANGELOG section as its
#            notes and the tarball and checksum attached. The only job with a write token.
#
# Setup, once: on npmjs.com, fuzzyhash-ng -> Settings -> Trusted Publisher -> GitHub Actions
# with organization Defense-Exploration-Holdings, repository fuzzyhash-ng, workflow
# publish.yml, environment npm; and a GitHub environment named `npm` on this repository
# (add required reviewers there if a release should wait for a person).
#
# Release: set "version" in packages/fuzzyhash-ng/package.json and build.zig.zon, add a
# CHANGELOG entry, merge, then push the matching tag (1.2.3 -> v1.2.3). A version with a
# pre-release part (1.2.3-rc.1) goes to the `next` dist-tag. While package.json still has
# "private": true, the publish job is skipped and only the GitHub Release is made, marked
# as a pre-release, with the package tarball attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v1.2.3"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Defense-Exploration-Holdings/fuzzyhash-ng'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      private: ${{ steps.version.outputs.private }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check the release tag format
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$RELEASE_TAG" =~ $re ]]; then
            shown="${RELEASE_TAG//[^0-9A-Za-z._-]/?}"
            echo "::error::'$shown' is not a release tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check the tag matches both versions
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/fuzzyhash-ng/package.json').version")"
          zon="$(sed -nE 's/^[[:space:]]*\.version = "([^"]+)".*/\1/p' build.zig.zon | head -n 1)"
          if [ "v$version" != "$RELEASE_TAG" ] || [ "$zon" != "$version" ]; then
            echo "::error::tag $RELEASE_TAG, package.json $version and build.zig.zon $zon must agree"
            exit 1
          fi
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          private="$(node -p "require('./packages/fuzzyhash-ng/package.json').private === true")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "private=$private" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRIVATE: ${{ steps.version.outputs.private }}
        run: |
          set -euo pipefail
          mkdir release-notes
          awk -v head="## $VERSION" '
            index($0, "## ") == 1 { if (on) exit; h = length(head); on = (index($0, head) == 1 && (length($0) == h || substr($0, h + 1, 1) == " ")); next }
            on { lines[++n] = $0 }
            END {
              s = 1; while (s <= n && lines[s] == "") s++
              e = n; while (e >= s && lines[e] == "") e--
              for (i = s; i <= e; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes/changelog.md
          {
            if [ -s release-notes/changelog.md ]; then cat release-notes/changelog.md; else echo "See the changelog for this version."; fi
            if [ "$PRIVATE" = true ]; then
              printf '\nNot published to npm. The package tarball is attached.\n'
            else
              printf '\n## Install\n\n```sh\nnpm install fuzzyhash-ng@%s\n```\n' "$VERSION"
            fi
          } > release-notes/notes.md
          rm release-notes/changelog.md

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Zig
        run: |
          scripts/install-zig.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test the shipped mode
        run: |
          node scripts/check-licenses.mjs
          zig build check --release=small

      - name: Pack
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          zig build js --release=small
          mkdir release
          (cd packages/fuzzyhash-ng && npm pack --ignore-scripts --pack-destination ../../release)
          cd release
          sha256sum "fuzzyhash-ng-$VERSION.tgz" | tee "fuzzyhash-ng-$VERSION.tgz.sha256"
          echo "sha256=$(cut -d' ' -f1 "fuzzyhash-ng-$VERSION.tgz.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'Defense-Exploration-Holdings/fuzzyhash-ng' && needs.build.outputs.private != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # OIDC token for npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DIST_TAG: ${{ needs.build.outputs.dist_tag }}
      EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support, exact version
        run: npm install -g --ignore-scripts npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release

      - name: Verify the tarball
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          [[ "$DIST_TAG" == latest || "$DIST_TAG" == next ]] || { echo "::error::bad dist-tag"; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad checksum from the build job"; exit 1; }
          cd release
          tarball="fuzzyhash-ng-$VERSION.tgz"
          [ "$(ls | sort | tr '\n' ' ')" = "$tarball $tarball.sha256 " ] || { echo "::error::unexpected files in the artifact"; ls -la; exit 1; }
          sha256sum -c "$tarball.sha256"
          [ "$(sha256sum "$tarball" | cut -d' ' -f1)" = "$EXPECTED_SHA256" ] || { echo "::error::tarball differs from the build job's checksum"; exit 1; }
          tar -tzf "$tarball" | sort
          tar -xzOf "$tarball" package/package.json | node -e '
            const p = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (p.name !== "fuzzyhash-ng" || p.version !== process.env.VERSION || p.private) {
              console.error("::error::package.json in the tarball does not match", p.name, p.version, p.private);
              process.exit(1);
            }'

      - name: Publish
        run: |
          set -euo pipefail
          # A version already on npm (for example a first release published by hand) is
          # left as it is, so the release job still runs for its tag.
          if npm view "fuzzyhash-ng@$VERSION" version >/dev/null 2>&1; then
            echo "fuzzyhash-ng@$VERSION is already on npm; not publishing it again."
            exit 0
          fi
          npm publish "./release/fuzzyhash-ng-$VERSION.tgz" --access public --tag "$DIST_TAG"

  release:
    needs: [build, publish]
    if: >-
      always() && github.repository == 'Defense-Exploration-Holdings/fuzzyhash-ng' &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.build.outputs.private == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release (never a tag: --verify-tag)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      DIST_TAG: ${{ needs.build.outputs.dist_tag }}
      PRIVATE: ${{ needs.build.outputs.private }}
      EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          [ "v$VERSION" = "$RELEASE_TAG" ] || { echo "::error::tag and version differ"; exit 1; }
          tarball="release/fuzzyhash-ng-$VERSION.tgz"
          [ "$(sha256sum "$tarball" | cut -d' ' -f1)" = "$EXPECTED_SHA256" ] || { echo "::error::tarball differs from the build job's checksum"; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; leaving it as it is."
            exit 0
          fi
          case "$DIST_TAG" in
            latest) flags=(--latest) ;;
            *) flags=(--prerelease --latest=false) ;;
          esac
          if [ "$PRIVATE" = true ]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "$tarball" "$tarball.sha256" \
            --verify-tag --title "$RELEASE_TAG" --notes-file release-notes/notes.md "${flags[@]}"
